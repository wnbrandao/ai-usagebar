name: Windows corner widget preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/popover/package-lock.json

      - name: Install popover dependencies
        working-directory: windows/popover
        run: npm ci

      - name: Smoke-test the widget
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -STA -File windows/corner-widget.ps1 -UsageExe unused -SmokeTest

      - name: Build Windows executables
        run: cargo build --release --locked --bin ai-usagebar --bin ai-usagebar-tray --bin ai-usagebar-tui

      - name: Package preview
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'widget-preview'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item target/release/ai-usagebar.exe, target/release/ai-usagebar-tray.exe, target/release/ai-usagebar-tui.exe $stage
          Copy-Item windows/README.md (Join-Path $stage 'README-Windows.md')
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath windows-corner-widget-preview.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-corner-widget-preview
          path: windows-corner-widget-preview.zip
          if-no-files-found: error
